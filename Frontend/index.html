<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore Riyanna Jelaine E. Monte's portfolio, interests, projects, and technical focus."
    />
    <meta name="theme-color" content="#fde8ec" />
    <title>Riyanna Monte | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Dancing+Script:wght@500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/portfolio.css" />
    <script src="/assets/js/main.js" type="module"></script>
  </head>
  <body>
    <main class="loading-screen" aria-labelledby="loading-title">
      <header class="loading-header">
        <a class="wordmark" href="/" aria-label="yanna home">yanna.</a>
        <p class="chapter-label">INTRO / A small beginning</p>
        <span class="close-mark" aria-hidden="true">×</span>
      </header>
      <section class="loading-content">
        <p class="eyebrow">Curiosity has a way of leading us home</p>
        <h1 class="loading-title" id="loading-title">
          <span>Good things begin</span>
          <span>with a little wonder.</span>
        </h1>
      </section>
      <object
        class="scene-art"
        data="/assets/images/portfolio-illustration.svg"
        type="image/svg+xml"
        role="group"
        aria-label="A cat approaching three strawberries beside an open portfolio box and a card reading A world of possibilities."
      ></object>
      <footer class="loading-footer">
        <p>Follow Strawcat. There's something lovely ahead.</p>
        <p class="sequence-caption">
          STROLL &amp; TASTE · FOLDER CENTERS · OPEN INTO HOME
        </p>
        <button
          class="skip-intro"
          type="button"
          aria-label="Skip intro and open portfolio"
        >
          Skip intro ↗
        </button>
      </footer>
    </main>
    <div class="portfolio-page" id="portfolio" hidden></div>
    <div class="screen-transition" aria-hidden="true"></div>
  </body>
</html>
