<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 450" fill="none">
  <style>
    .cat {
      transform-box: view-box;
      transform-origin: 0 0;
      animation: cat-journey 10s cubic-bezier(0.35, 0, 0.2, 1) both;
    }

    .cat-body-motion {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: cat-bob 10s ease-in-out both;
    }

    .strawberry--one {
      animation: strawberry-eaten 800ms 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .strawberry--two {
      animation: strawberry-eaten 800ms 3.2s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .strawberry--three {
      animation: strawberry-eaten 800ms 5.2s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .card {
      transform-box: view-box;
      transform-origin: 0 0;
      animation: card-to-center 1.8s 8.3s cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    .card-trigger {
      cursor: pointer;
    }

    .card-trigger:focus-visible {
      filter: drop-shadow(0 0 4px #d4607a);
    }

    @keyframes cat-journey {
      0% { transform: translate(0, 0); }
      12% { transform: translate(108px, 41px); }
      20% { transform: translate(108px, 41px); }
      32% { transform: translate(173px, 41px); }
      40% { transform: translate(173px, 41px); }
      52% { transform: translate(268px, 2px); }
      60% { transform: translate(268px, 2px); }
      68% { transform: translate(300px, 28px); }
      100% { transform: translate(300px, 28px); }
    }

    @keyframes cat-bob {
      0%, 12%, 20%, 32%, 40%, 52%, 60%, 68%, 100% { transform: translateY(0); }
      3%, 9%, 23%, 29%, 43%, 49%, 63%, 66% { transform: translateY(-2px); }
      6%, 26%, 46% { transform: translateY(1px); }
      14%, 18%, 34%, 38%, 54%, 58% { transform: translateY(1px); }
    }

    @keyframes strawberry-eaten {
      0%, 20% { opacity: 1; transform: scale(1) translateY(0); }
      35% { opacity: 1; transform: scale(0.82) translateY(2px); }
      52% { opacity: 1; transform: scale(0.95) translateY(-1px); }
      72% { opacity: 0.8; transform: scale(0.42) translateY(4px); }
      100% { opacity: 0; transform: scale(0) translateY(7px); }
    }

    @keyframes card-to-center {
      from { transform: translate(0, 0); }
      28% { transform: translate(0, -12px); }
      to { transform: translate(668px, 148px) scale(1.45) translate(-938px, -157px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cat,
      .cat-body-motion,
      .strawberry,
      .card {
        animation: none !important;
      }

      .cat { transform: translate(300px, 28px) !important; }
      .strawberry { opacity: 0 !important; }
      .card {
        transform: translate(668px, 148px) scale(1.45) translate(-938px, -157px) !important;
      }
    }
  </style>

  <ellipse cx="710" cy="353" rx="410" ry="13" fill="#E8A0B0" opacity=".35"/>

  <g class="cat">
    <g class="cat-art" transform="translate(285 186)">
      <g class="cat-body-motion">
        <defs>
          <clipPath id="cat-clip">
            <rect width="214" height="170"/>
          </clipPath>
        </defs>
        <image
          href="strawcat.png"
          x="-22.4"
          y="-37.3"
          width="248.84"
          height="248.9"
          preserveAspectRatio="none"
          clip-path="url(#cat-clip)"
        />
      </g>
    </g>
  </g>

  <image href="portfolio-folder-back.png" x="773" y="129" width="330" height="220"/>

  <g
    class="card card-trigger"
    role="button"
    tabindex="0"
    aria-label="Open a world of possibilities"
  >
    <image href="portfolio-homepage-paper.png" x="797" y="52.42" width="282" height="210"/>
  </g>

  <image href="portfolio-folder-flap.png" x="761" y="195" width="354" height="154"/>
  <image href="portfolio-folder-label.png" x="853" y="257" width="195" height="40"/>

  <g transform="translate(557 285.81) rotate(14 16 21.5)">
    <g class="strawberry strawberry--one">
      <image href="strawberry.png" width="32" height="43"/>
    </g>
  </g>

  <g transform="translate(621.21 286) rotate(-12 16 21.5)">
    <g class="strawberry strawberry--two">
      <image href="strawberry.png" width="32" height="43"/>
    </g>
  </g>

  <g transform="translate(717 246.21) rotate(12 16 21.5)">
    <g class="strawberry strawberry--three">
      <image href="strawberry.png" width="32" height="43"/>
    </g>
  </g>
</svg>
